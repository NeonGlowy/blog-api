<!DOCTYPE html>
<html>
<head>
  <title>Mini Blog</title>
  <style>
    body { font-family: sans-serif; padding: 20px; }
    input, textarea { display: block; margin-bottom: 10px; width: 300px; }
    button { padding: 5px 10px; }
    .post { margin-bottom: 15px; border-bottom: 1px solid #ccc; padding-bottom: 10px; }
  </style>
</head>
<body>
  <h1>Create a Blog Post</h1>
  <input id="title" placeholder="Title" />
  <textarea id="content" placeholder="Content"></textarea>
  <button onclick="createPost()">Submit</button>

  <h2>All Posts</h2>
  <div id="posts"></div>

  <script>
    const API_URL = 'http://localhost:3000/posts';

    async function createPost() {
      const title = document.getElementById('title').value;
      const content = document.getElementById('content').value;

      await fetch(API_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title, content })
      });

      document.getElementById('title').value = '';
      document.getElementById('content').value = '';
      loadPosts();
    }

  async function createPost() {
    const title = document.getElementById('title').value;
    const content = document.getElementById('content').value;

    await fetch(API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title, content })
    });

    document.getElementById('title').value = '';
    document.getElementById('content').value = '';
    loadPosts();
  }

  async function deletePost(id) {
    await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
    loadPosts();
  }

  async function updatePost(id) {
    const newTitle = prompt('Enter new title:');
    const newContent = prompt('Enter new content:');
    if (!newTitle || !newContent) return;

    await fetch(`${API_URL}/${id}`, {
      method: 'PUT',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ title: newTitle, content: newContent })
    });

    loadPosts();
  }

  async function loadPosts() {
    const res = await fetch(API_URL);
    const posts = await res.json();
    const container = document.getElementById('posts');
    container.innerHTML = posts.map(p => `
      <div class="post">
        <h3>${p.title}</h3>
        <p>${p.content}</p>
        <small>Posted on ${new Date(p.created_at).toLocaleString()}</small><br>
        <button onclick="updatePost(${p.id})">Edit</button>
        <button onclick="deletePost(${p.id})">Delete</button>
      </div>
    `).join('');
  }

  loadPosts();


  </script>
</body>
</html>
